            exit 1
          fi
          grep -qxF 'CONFIG_PACKAGE_opennds=y' .config
          grep -qxF 'CONFIG_PACKAGE_kmod-econet-eth=y' .config
          grep -qxF 'CONFIG_PACKAGE_opkg=y' .config
          grep -qxF '# CONFIG_USE_APK is not set' .config
          grep -q 'parts\[1\].size = rootfs_size;' target/linux/generic/files/drivers/mtd/mtdsplit/mtdsplit_tclinux.c
          echo "=== Selected device profile(s) in .config ==="
          grep -E '^CONFIG_TARGET_(DEVICE_)?econet_en751221_DEVICE_|^CONFIG_TARGET_MULTI_PROFILE|^CONFIG_TARGET_ALL_PROFILES|^CONFIG_IB=' .config || true
          grep -qxF 'CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y' .config
          test "$(grep -cE '^CONFIG_TARGET_(DEVICE_)?econet_en751221_DEVICE_.*=y' .config)" -eq 1
          grep -qxF 'CONFIG_MTD_SPLIT_TCLINUX_FW=y' target/linux/econet/en751221/config-6.18
          grep -qxF 'CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000' target/linux/econet/en751221/config-6.18
          test -f target/linux/generic/files/drivers/mtd/mtdsplit/mtdsplit_tclinux.c
 

      - name: Calculate build cache key
        shell: bash
        run: |
          set -eux
          BUILD_HASH="$(
            {
              sha256sum .config
              sha256sum feeds.conf.default
              sha256sum target/linux/econet/dts/en751221_generic.dts
              sha256sum target/linux/econet/dts/en751221.dtsi
              sha256sum package/kernel/econet-eth/Makefile
              sha256sum target/linux/econet/en751221/config-6.18
              sha256sum target/linux/econet/patches-6.18/999-en751221-zboot-kernel-load-address.patch
              sha256sum target/linux/econet/image/en751221.mk
              sha256sum target/linux/generic/files/drivers/mtd/mtdsplit/mtdsplit_tclinux.c
              sha256sum target/linux/generic/files/drivers/mtd/mtdsplit/Kconfig
              sha256sum target/linux/generic/files/drivers/mtd/mtdsplit/Makefile
              sha256sum files/usr/sbin/accessctl
              sha256sum files/usr/lib/opennds/ac1000hi-token.sh
              sha256sum files/etc/config/opennds
              sha256sum files/etc/crontabs/root
              sha256sum files/etc/uci-defaults/99-lan-split
              sha256sum package/kernel/econet-eth/patches/100-econet-eth-lan-split.patch
              cat ci/patches/*.patch 2>/dev/null | sha256sum || true
              printf '%s\n' 'AC1000HI_RELEASE_STACK=v5-v4driver-lan4-wan-nondsa-4ports'
              printf '%s\n' 'EN751221_ZBOOT_KERNEL_LOAD=0x85000000'
              printf '%s\n' 'AC1000HI_NAND_SIZE=0x08000000'
              printf '%s\n' 'AC1000HI_NAND_ERASEBLOCK=0x20000'
              printf '%s\n' 'AC1000HI_NAND_RESERVE_BLOCKS=81'
              printf '%s\n' 'AC1000HI_NAND_RAWB=0x075e0000'
              printf '%s\n' 'AC1000HI_NAND_BMT=0x07fe0000'
            } | sha256sum | cut -d' ' -f1
          )"
          BUILD_CACHE_KEY="${{ runner.os }}-openwrt-en751221-ac1000hi-v5-${OPENWRT_REV}-${FEEDS_REV_HASH}-${BUILD_HASH}"
          echo "BUILD_HASH=$BUILD_HASH" >> "$GITHUB_ENV"
          echo "BUILD_CACHE_KEY=$BUILD_CACHE_KEY" >> "$GITHUB_ENV"
          echo "$BUILD_CACHE_KEY"

      - name: Restore OpenWrt build tree
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir
            staging_dir
          key: ${{ env.BUILD_CACHE_KEY }}

      - name: Prepare and verify EN751221 zboot placement
        shell: bash
        run: |
          set -eux

          echo "=== Build tools and toolchain ==="
          make -j$(($(nproc)+1)) tools/install toolchain/install

          echo "=== Prepare kernel source ==="
          make target/linux/prepare V=s

          echo "=== Generate kernel config ==="
          # kernel_oldconfig REWRITES target/linux/econet/en751221/config-6.18,
          # which drops the lines added by "Fix EN751221 kernel config".
          # Back it up and restore it afterwards so the real build still has them.
          CONFIG_6_18="target/linux/econet/en751221/config-6.18"
          cp "$CONFIG_6_18" /tmp/config-6.18.bak
          yes "" | make kernel_oldconfig V=s
          cp /tmp/config-6.18.bak "$CONFIG_6_18"
          grep -qxF '# CONFIG_MEDIATEK_GE_SOC_PHY is not set' "$CONFIG_6_18"
          grep -qxF 'CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000' "$CONFIG_6_18"
          grep -qxF 'CONFIG_MTD_SPLIT_TCLINUX_FW=y' "$CONFIG_6_18"

          echo "=== Final kernel config ==="

          KERNEL_CONFIG="$(
            find build_dir/target-*/linux-econet_en751221/linux-*/ \
              -maxdepth 1 \
              -name .config \
              -type f \
              -print |
              head -n 1
          )"

          test -n "$KERNEL_CONFIG"
          test -f "$KERNEL_CONFIG"

          grep -qxF 'CONFIG_MTD_SPLIT_TCLINUX_FW=y' "$KERNEL_CONFIG"
          grep -qxF 'CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000' "$KERNEL_CONFIG"
          grep -qxF 'CONFIG_MTD_SPLIT_TCLINUX_FW=y' "$KERNEL_CONFIG"
          grep -qxF 'CONFIG_MTD_SPLIT=y' "$KERNEL_CONFIG"
          grep -qxF 'CONFIG_VLAN_8021Q=y' "$KERNEL_CONFIG"
          grep -qxF '# CONFIG_NET_DSA is not set' "$KERNEL_CONFIG"
          grep -qxF '# CONFIG_NET_DSA_MT7530 is not set' "$KERNEL_CONFIG"

          echo "Kernel config: $KERNEL_CONFIG"

          PLATFORM_FILE="$(find build_dir -type f -path '*/arch/mips/econet/Platform' -print | head -n 1)"
          test -n "$PLATFORM_FILE"
          grep -Fq 'load-$(CONFIG_ECONET)' "$PLATFORM_FILE"
          grep -Fq '0xffffffff85000000' "$PLATFORM_FILE"

          if grep -Fq '0xffffffff81000000' "$PLATFORM_FILE"; then
            echo "ERROR: old 0x81000000 load address is still present."
            exit 1
          fi

          echo "ZBOOT wrapper load address = 0x80020000"
          echo "Linux kernel load/link address = 0x85000000"

      - name: Pre-build final validation
        shell: bash
        run: |
          set -euxo pipefail

          DTS="target/linux/econet/dts/en751221_generic.dts"
          CONFIG="target/linux/econet/en751221/config-6.18"
          IMAGE_MK="target/linux/econet/image/en751221.mk"

          test -f "$DTS"
          test -f "$CONFIG"
          test -f "$IMAGE_MK"

          echo "=== Memory ==="

          grep -qF \
            'reg = <0x00000000 0x10000000>;' \
            "$DTS"

          grep -qF \
            'linux,usable-memory-range = <0x00020000 0x0ffe0000>;' \
            "$DTS"

          echo "=== NAND/BMT ==="

          grep -qF \
            'econet,bmt;' \
            "$DTS"

          grep -qF \
            'econet,bbt-table-size = <1000>;' \
            "$DTS"

          grep -qF \
            'econet,assert-reserve-size = <81>;' \
            "$DTS"

          echo "=== Vendor NAND layout ==="

          grep -q \
            'reg = <0x00080000 0x01e00000>;' \
            "$DTS"

          grep -q \
            'reg = <0x01e80000 0x01e00000>;' \
            "$DTS"

          grep -q \
            'reg = <0x03c80000 0x00500000>;' \
            "$DTS"

          grep -q \
            'reg = <0x04180000 0x00500000>;' \
            "$DTS"

          grep -q \
            'reg = <0x04680000 0x02ec0000>;' \
            "$DTS"

          echo "=== zboot ==="

          grep -qxF \
            'CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000' \
            "$CONFIG"

          echo "=== tclinux parser ==="

          grep -qxF \
            'CONFIG_MTD_SPLIT_TCLINUX_FW=y' \
            "$CONFIG"

          test -s \
            target/linux/generic/files/drivers/mtd/mtdsplit/mtdsplit_tclinux.c

          echo "=== image recipe ==="

          grep -q \
            'IMAGES := tclinux.trx' \
            "$IMAGE_MK"

          grep -q \
            'IMAGE/tclinux.trx := append-kernel | lzma | tclinux-trx' \
            "$IMAGE_MK"

          echo "=== Ethernet driver / VLAN ==="
          test -s package/kernel/econet-eth/patches/100-econet-eth-lan-split.patch
          grep -qF '#define EN75_SW_LAN_PORTS' package/kernel/econet-eth/patches/100-econet-eth-lan-split.patch
          grep -qF '#define EN75_SW_LAN_PORTS		4' package/kernel/econet-eth/patches/100-econet-eth-lan-split.patch
          grep -qF '#define EN75_SW_VID_BASE		101' package/kernel/econet-eth/patches/100-econet-eth-lan-split.patch
          grep -qF 'for vid in 101 102 103 104' files/etc/uci-defaults/99-lan-split
          grep -qF "uci set network.br_lan.type='bridge'" files/etc/uci-defaults/99-lan-split
          grep -qF "uci set network.wan='interface'" files/etc/uci-defaults/99-lan-split
          grep -qF "uci set network.wan.device='lan4'" files/etc/uci-defaults/99-lan-split
          grep -qxF 'CONFIG_PACKAGE_kmod-econet-eth=y' .config
          grep -qxF 'CONFIG_VLAN_8021Q=y' target/linux/generic/config-6.18
          grep -qxF '# CONFIG_NET_DSA is not set' target/linux/generic/config-6.18

          echo
          echo "ALL EN751221 PRE-BUILD VALIDATIONS PASSED"

      - name: Build OpenWrt
        id: build
        shell: bash
        run: |
          set -eux
          make -j$(($(nproc)+1)) V=s

      - name: Save OpenWrt build tree
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir
            staging_dir
          key: ${{ env.BUILD_CACHE_KEY }}

      - name: Verify initramfs kernel image
        shell: bash
        run: |
          set -euxo pipefail

          IMG="bin/targets/econet/en751221/openwrt-econet-en751221-en751221_generic-initramfs-kernel.bin"

          echo "=== en751221_generic outputs ==="
          ls -l bin/targets/econet/en751221/ | grep en751221_generic || true

          test -f "$IMG"
          SIZE="$(stat -c '%s' "$IMG")"
          echo "Image size: $SIZE bytes"
          test "$SIZE" -gt 0

          sha256sum "$IMG" | tee "$IMG.sha256"

      - name: Verify production tclinux image
        shell: bash
        run: |
          set -euxo pipefail
          IMG="bin/targets/econet/en751221/openwrt-econet-en751221-en751221_generic-tclinux.trx"
          test -f "$IMG"
          SIZE="$(stat -c '%s' "$IMG")"
          echo "tclinux.trx size: $SIZE bytes"
          test "$SIZE" -gt 0
          test "$SIZE" -le $((0x01e00000))
          python3 - "$IMG" <<'PY'
          import os, struct, sys
          p = sys.argv[1]
          with open(p, 'rb') as f:
              h = f.read(0x100)
          if len(h) != 0x100 or h[:4] != b'2RDH':
              raise SystemExit('ERROR: invalid tclinux 2RDH header')
          hdrlen, total_len, crc32 = struct.unpack_from('>III', h, 4)
          kernel_len, rootfs_len, romfile_len = struct.unpack_from('>III', h, 80)
          loadaddr = struct.unpack_from('>I', h, 124)[0]
          if hdrlen != 0x100:
              raise SystemExit(f'ERROR: bad hdrlen 0x{hdrlen:x}')
          if not kernel_len or not rootfs_len:
              raise SystemExit('ERROR: zero kernel/rootfs length')
          if loadaddr != 0x80020000:
              raise SystemExit(f'ERROR: unexpected loadaddr 0x{loadaddr:08x}')
          if hdrlen + kernel_len != 0x00400000:
              raise SystemExit(f'ERROR: kernel slot is not exactly 4 MiB: 0x{hdrlen + kernel_len:x}')
          if total_len != 0x00400000 + rootfs_len:
              raise SystemExit('ERROR: total_len is not 4 MiB + rootfs_len')
          if total_len > 0x01e00000:
              raise SystemExit(f'ERROR: total_len 0x{total_len:x} exceeds tclinux partition')
          if total_len != os.path.getsize(p):
              raise SystemExit('ERROR: file size does not equal header total_len')
          if hdrlen + kernel_len + rootfs_len > total_len:
              raise SystemExit('ERROR: header lengths exceed total_len')
          print(f'2RDH OK: total=0x{total_len:x}, kernel=0x{kernel_len:x}, rootfs=0x{rootfs_len:x}, load=0x{loadaddr:08x}')
          PY
          sha256sum "$IMG" | tee "$IMG.sha256"

      - name: Save build metadata
        shell: bash
        run: |
          set -eux
          OUT="bin/targets/econet/en751221"
          mkdir -p "$OUT/build-info"

          cp .config "$OUT/build-info/config"
          cp target/linux/econet/dts/en751221_generic.dts "$OUT/build-info/en751221_generic.dts"
          cp target/linux/econet/dts/en751221.dtsi "$OUT/build-info/en751221.dtsi"
          cp target/linux/generic/config-6.18 "$OUT/build-info/generic-kernel-config"
          cp package/kernel/econet-eth/Makefile "$OUT/build-info/econet-eth-Makefile"
          cp target/linux/econet/en751221/config-6.18 "$OUT/build-info/en751221-kernel-config"
          cp target/linux/econet/image/en751221.mk "$OUT/build-info/en751221-image.mk"
          cp target/linux/generic/files/drivers/mtd/mtdsplit/mtdsplit_tclinux.c "$OUT/build-info/mtdsplit_tclinux.c"
          cp files/etc/uci-defaults/99-lan-split "$OUT/build-info/99-lan-split"
          cp package/kernel/econet-eth/patches/100-econet-eth-lan-split.patch "$OUT/build-info/econet-eth-lan-split.patch"

          git rev-parse HEAD > "$OUT/build-info/openwrt-revision.txt"
          printf '%s\n' "$FEEDS_REV_HASH" > "$OUT/build-info/feeds-revision-hash.txt"
          printf '%s\n' "$BUILD_CACHE_KEY" > "$OUT/build-info/build-cache-key.txt"
          date -u > "$OUT/build-info/build-time-utc.txt"

      - name: Upload Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-en751221-generic-initramfs
          path: |
            bin/targets/econet/en751221/*en751221_generic*
            bin/targets/econet/en751221/build-info/
          if-no-files-found: error
          retention-days: 7
