name: Build EN751221 256M FULL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          fetch-depth: 1

      - name: Record OpenWrt revision
        shell: bash
        run: |
          set -eux

          OPENWRT_REV="$(git rev-parse HEAD)"
          echo "OPENWRT_REV=$OPENWRT_REV" >> "$GITHUB_ENV"

          echo "OpenWrt revision:"
          echo "$OPENWRT_REV"

      - name: Free runner disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc

      - name: Restore OpenWrt downloads and feeds
        uses: actions/cache/restore@v4
        with:
          path: |
            dl
            feeds
          key: ${{ runner.os }}-openwrt-downloads-${{ env.OPENWRT_REV }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-downloads-

      - name: Update and install required OpenWrt feeds
        shell: bash
        run: |
          set -eux

          ./scripts/feeds update packages
          ./scripts/feeds update luci

          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci

          ./scripts/feeds list

          test -d feeds/packages
          test -d feeds/luci

          FEEDS_REV_HASH="$(
            {
              git -C feeds/packages rev-parse HEAD
              git -C feeds/luci rev-parse HEAD
            } | sha256sum | cut -d' ' -f1
          )"

          echo "FEEDS_REV_HASH=$FEEDS_REV_HASH" >> "$GITHUB_ENV"

          echo
          echo "Feeds revision hash:"
          echo "$FEEDS_REV_HASH"

      - name: Save OpenWrt downloads and feeds
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            feeds
          key: ${{ runner.os }}-openwrt-downloads-${{ env.OPENWRT_REV }}-${{ hashFiles('feeds.conf.default') }}

      - name: Patch EN751221 256M DTS
        shell: bash
        run: |
          set -eux

          DTS="target/linux/econet/dts/en751221_generic.dts"

          test -f "$DTS"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("target/linux/econet/dts/en751221_generic.dts")
          s = p.read_text()

          replacements = [
              (
                  "reg = <0x00000000 0x4000000>;",
                  "reg = <0x00000000 0x10000000>;"
              ),
              (
                  "linux,usable-memory-range = <0x00020000 0x3fe0000>;",
                  "linux,usable-memory-range = <0x00020000 0x0ffe0000>;"
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(
                      f"ERROR: expected DTS text not found: {old}"
                  )

              s = s.replace(old, new, 1)

          if "&pcie0 {" not in s:
              s += r'''

          &pcie0 {
              status = "okay";
          };

          &pcie1 {
              status = "okay";
          };
          '''

          p.write_text(s)
          PY

          echo "Patched DTS:"
          sed -n '1,320p' "$DTS"

          grep -q 'reg = <0x00000000 0x10000000>;' "$DTS"
          grep -q 'linux,usable-memory-range = <0x00020000 0x0ffe0000>;' "$DTS"

          grep -q '&pcie0 {' "$DTS"
          grep -q '&pcie1 {' "$DTS"

      - name: Fix EN751221 kernel config
        shell: bash
        run: |
          set -eux

          CONFIG="target/linux/econet/en751221/config-6.18"

          test -f "$CONFIG"

          if ! grep -qxF '# CONFIG_MEDIATEK_GE_SOC_PHY is not set' "$CONFIG"; then
            printf '%s\n' '# CONFIG_MEDIATEK_GE_SOC_PHY is not set' >> "$CONFIG"
          fi

          if ! grep -qxF 'CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000' "$CONFIG"; then
            printf '%s\n' 'CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000' >> "$CONFIG"
          fi

          grep -E \
            '^(CONFIG_PHYLIB|CONFIG_MEDIATEK_GE_PHY|CONFIG_MTK_NET_PHYLIB|CONFIG_MEDIATEK_GE_SOC_PHY|# CONFIG_MEDIATEK_GE_SOC_PHY|CONFIG_ZBOOT_LOAD_ADDRESS)' \
            "$CONFIG" || true

          cat "$CONFIG"

      - name: Add EN751221 zboot kernel placement patch
        shell: bash
        run: |
          set -eux

          PATCH_DIR="target/linux/econet/patches-6.18"
          PATCH_FILE="$PATCH_DIR/999-en751221-zboot-kernel-load-address.patch"

          mkdir -p "$PATCH_DIR"

          cat > "$PATCH_FILE" <<'PATCH'
          --- a/arch/mips/econet/Platform
          +++ b/arch/mips/econet/Platform
          @@ -1,4 +1,4 @@
           # To address a 7.2MB kernel size limit in the EcoNet SDK bootloader,
           # we put the load address well above where the bootloader loads and then use zboot. So please set CONFIG_ZBOOT_LOAD_ADDRESS to the address where your bootloader actually places the kernel.
          -load-$(CONFIG_ECONET)	+= 0xffffffff81000000
          +load-$(CONFIG_ECONET)	+= 0xffffffff85000000
          PATCH

          cat "$PATCH_FILE"

          test -s "$PATCH_FILE"

          grep -Fq 'load-$(CONFIG_ECONET)' "$PATCH_FILE"
          grep -Fq '0xffffffff81000000' "$PATCH_FILE"
          grep -Fq '0xffffffff85000000' "$PATCH_FILE"

      - name: Configure EN751221 FULL image
        shell: bash
        run: |
          set -eux

          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          CONFIG_PACKAGE_base-files=y
          CONFIG_PACKAGE_netifd=y

          CONFIG_PACKAGE_ethtool-full=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_mdio-tools=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_odhcpd=y
          CONFIG_PACKAGE_odhcp6c=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7615-common=y
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-mt7615-firmware=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_hostapd-utils=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_usbutils=y

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-exfat=y

          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_PACKAGE_kmod-i2c-dev=y
          CONFIG_PACKAGE_gpiod-tools=y
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_kmod-leds-gpio=y

          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-nat=y
          CONFIG_PACKAGE_kmod-nf-nat6=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          CONFIG_PACKAGE_kmod-ipt-core=y

          CONFIG_PACKAGE_kmod-tun=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y

          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_nlbwmon=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd=y

          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_adblock=y

          CONFIG_PACKAGE_luci-app-ksmbd=y
          CONFIG_PACKAGE_ksmbd-server=y

          CONFIG_PACKAGE_luci-i18n-firewall-vi=y
          CONFIG_PACKAGE_luci-i18n-package-manager-vi=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-vi=y
          CONFIG_PACKAGE_luci-i18n-attendedsysupgrade-vi=y
          CONFIG_PACKAGE_luci-i18n-sqm-vi=y
          CONFIG_PACKAGE_luci-i18n-nlbwmon-vi=y
          CONFIG_PACKAGE_luci-i18n-statistics-vi=y
          CONFIG_PACKAGE_luci-i18n-adblock-vi=y
          CONFIG_PACKAGE_luci-i18n-ksmbd-vi=y

          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_uhttpd-mod-ucode=y

          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_nand-utils=y
          CONFIG_PACKAGE_ubi-utils=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_mount-utils=y

          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_zoneinfo-asia=y

          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_strace=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_btop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_lsof=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_procps-ng=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_logrotate=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_minicom=y
          CONFIG_PACKAGE_gdbserver=y
          EOF

          make defconfig

          grep -E '^(CONFIG_TARGET_|CONFIG_PACKAGE_)' .config | sort

      - name: Validate requested configuration
        shell: bash
        run: |
          set -eux

          REQUIRED='
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-uhttpd=y

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_uhttpd-mod-ucode=y

          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y

          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7615-common=y
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-mt7615-firmware=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_hostapd-utils=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y

          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-nat=y
          CONFIG_PACKAGE_kmod-nf-nat6=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          CONFIG_PACKAGE_kmod-ipt-core=y

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_usbutils=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y

          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_nand-utils=y
          CONFIG_PACKAGE_ubi-utils=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_gdbserver=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_minicom=y
          CONFIG_PACKAGE_logrotate=y
          '

          FAILED=0

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            if ! grep -qxF "$line" .config; then
              echo "MISSING CONFIG: $line"
              grep -E "^#? ?${line%%=*}" .config || true
              FAILED=1
            fi
          done <<< "$REQUIRED"

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: One or more required CONFIG options were dropped."
            exit 1
          fi

          echo "All critical configuration options survived defconfig."

      - name: Calculate build cache key
        shell: bash
        run: |
          set -eux

          BUILD_HASH="$(
            {
              sha256sum .config
              sha256sum feeds.conf.default
              sha256sum target/linux/econet/dts/en751221_generic.dts
              sha256sum target/linux/econet/en751221/config-6.18
              sha256sum target/linux/econet/patches-6.18/999-en751221-zboot-kernel-load-address.patch
            } | sha256sum | cut -d' ' -f1
          )"

          BUILD_CACHE_KEY="${{ runner.os }}-openwrt-en751221-build-v2-${OPENWRT_REV}-${FEEDS_REV_HASH}-${BUILD_HASH}"

          echo "BUILD_HASH=$BUILD_HASH" >> "$GITHUB_ENV"
          echo "BUILD_CACHE_KEY=$BUILD_CACHE_KEY" >> "$GITHUB_ENV"

          echo "Build cache key:"
          echo "$BUILD_CACHE_KEY"

      - name: Restore OpenWrt build tree
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build_dir
            staging_dir
          key: ${{ env.BUILD_CACHE_KEY }}

      - name: Prepare and verify EN751221 zboot placement
        shell: bash
        run: |
          set -eux

          echo "Build cache result:"
          echo "${{ steps.restore-build-cache.outputs.cache-hit }}"

          make target/linux/prepare V=s

          PLATFORM_FILE="$(
            find build_dir \
              -type f \
              -path '*/arch/mips/econet/Platform' \
              -print \
              | head -n 1
          )"

          if [ -z "$PLATFORM_FILE" ]; then
            echo "ERROR: Could not locate arch/mips/econet/Platform"

            find build_dir \
              -type f \
              -path '*/arch/mips/*/Platform' \
              -print \
              | sort || true

            exit 1
          fi

          echo "EN751221 Platform file:"
          echo "$PLATFORM_FILE"

          cat "$PLATFORM_FILE"

          grep -Fq \
            'load-$(CONFIG_ECONET)' \
            "$PLATFORM_FILE"

          grep -Fq \
            '0xffffffff85000000' \
            "$PLATFORM_FILE"

          if grep -Fq \
            '0xffffffff81000000' \
            "$PLATFORM_FILE"; then
            echo "ERROR: old 0x81000000 load address is still present."
            exit 1
          fi

          grep -qxF \
            'CONFIG_ZBOOT_LOAD_ADDRESS=0x80020000' \
            target/linux/econet/en751221/config-6.18

          echo "ZBOOT wrapper load address = 0x80020000"
          echo "Linux kernel load/link address = 0x85000000"

      - name: Build OpenWrt
        id: build
        shell: bash
        run: |
          set -eux

          echo "Build cache result:"
          echo "${{ steps.restore-build-cache.outputs.cache-hit }}"

          make -j2 V=s

      - name: Save OpenWrt build tree
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir
            staging_dir
          key: ${{ env.BUILD_CACHE_KEY }}

      - name: Verify built root filesystem
        shell: bash
        run: |
          set -eux

          ROOTFS=""

          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue

            if [ -d "$candidate/etc" ] && [ -d "$candidate/www" ]; then
              ROOTFS="$candidate"
              break
            fi
          done < <(
            find build_dir staging_dir \
              -type d \
              \( -name 'root-*' -o -name 'root' \) \
              2>/dev/null \
              | sort
          )

          if [ -n "$ROOTFS" ]; then
            echo "Target root filesystem:"
            echo "$ROOTFS"

            test -d "$ROOTFS/etc"
            test -d "$ROOTFS/www"

            if [ -d "$ROOTFS/usr/lib/lua/luci" ]; then
              echo "LuCI Lua runtime found."
            elif [ -d "$ROOTFS/usr/share/ucode/luci" ]; then
              echo "LuCI ucode runtime found."
            else
              echo "WARNING: LuCI runtime directory not found in staging root."
            fi

            if [ -e "$ROOTFS/etc/config/uhttpd" ]; then
              echo "uHTTPd configuration found."
            else
              echo "WARNING: uHTTPd configuration not found in staging root."
            fi

            if [ -e "$ROOTFS/etc/config/firewall" ]; then
              echo "Firewall configuration found."
            else
              echo "WARNING: firewall configuration not found in staging root."
            fi

            ls -lah "$ROOTFS"

            if [ -d "$ROOTFS/usr/lib/lua/luci" ]; then
              find "$ROOTFS/usr/lib/lua/luci" \
                -maxdepth 2 \
                -type f \
                | head -100
            fi

            if [ -d "$ROOTFS/usr/share/ucode/luci" ]; then
              find "$ROOTFS/usr/share/ucode/luci" \
                -maxdepth 2 \
                -type f \
                | head -100
            fi

            find "$ROOTFS/www" \
              -maxdepth 3 \
              -type f \
              | sort \
              | head -100

            find "$ROOTFS/lib/modules" \
              -type f \
              | grep -E 'mt7615|mt76' \
              | sort || true

            find "$ROOTFS/lib/modules" \
              -type f \
              | grep -E 'usb|xhci|ehci|ohci|uas|scsi' \
              | sort || true

            find "$ROOTFS/usr" \
              -type f \
              | grep -E '/(nanddump|nandwrite|flash_erase|mtdinfo|ubinfo|ubiattach|ubidetach|ubiformat)$' \
              | sort || true
          else
            echo "No persistent target root directory was found."
            echo "This is not considered a build failure."

            find build_dir staging_dir \
              -type d \
              \( -name 'root-*' -o -name 'root' \) \
              -print \
              2>/dev/null \
              | sort || true
          fi

          echo "Root filesystem verification completed."

      - name: Verify output
        shell: bash
        run: |
          set -eux

          OUT="bin/targets/econet/en751221"

          test -d "$OUT"

          FILE_COUNT="$(find "$OUT" -maxdepth 1 -type f | wc -l)"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No build output files found."
            exit 1
          fi

          echo "Output files:"
          ls -lah "$OUT"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -exec file {} \;

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -exec sha256sum {} \; \
            | sort

      - name: Save build metadata
        shell: bash
        run: |
          set -eux

          OUT="bin/targets/econet/en751221"

          mkdir -p "$OUT/build-info"

          cp .config \
            "$OUT/build-info/config"

          cp target/linux/econet/dts/en751221_generic.dts \
            "$OUT/build-info/en751221_generic.dts"

          cp target/linux/econet/en751221/config-6.18 \
            "$OUT/build-info/en751221-kernel-config"

          cp target/linux/econet/patches-6.18/999-en751221-zboot-kernel-load-address.patch \
            "$OUT/build-info/en751221-zboot-load-address.patch"

          git rev-parse HEAD \
            > "$OUT/build-info/openwrt-revision.txt"

          printf '%s\n' "$FEEDS_REV_HASH" \
            > "$OUT/build-info/feeds-revision-hash.txt"

          printf '%s\n' "$BUILD_CACHE_KEY" \
            > "$OUT/build-info/build-cache-key.txt"

          date -u \
            > "$OUT/build-info/build-time-utc.txt"

          cat "$OUT/build-info/openwrt-revision.txt"
          cat "$OUT/build-info/feeds-revision-hash.txt"
          cat "$OUT/build-info/build-cache-key.txt"
          cat "$OUT/build-info/build-time-utc.txt"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-en751221-build4-256m-full-luci-zboot850
          path: bin/targets/econet/en751221/
          if-no-files-found: error
          retention-days: 7