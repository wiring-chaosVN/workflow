name: Build EN751221 256M FULL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          fetch-depth: 1

      - name: Record OpenWrt revision
        shell: bash
        run: |
          set -eux

          OPENWRT_REV="$(git rev-parse HEAD)"
          echo "OPENWRT_REV=$OPENWRT_REV" >> "$GITHUB_ENV"

          echo "OpenWrt revision: $OPENWRT_REV"

      - name: Free runner disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            python3-pip \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc

      - name: Cache OpenWrt downloads and feeds
        uses: actions/cache@v4
        with:
          path: |
            dl
            feeds
          key: ${{ runner.os }}-openwrt-downloads-${{ env.OPENWRT_REV }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-downloads-

      - name: Update and install required OpenWrt feeds
        shell: bash
        run: |
          set -eux

          ./scripts/feeds update packages
          ./scripts/feeds update luci

          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci

          ./scripts/feeds list

      - name: Patch EN751221 256M DTS
        shell: bash
        run: |
          set -eux

          DTS="target/linux/econet/dts/en751221_generic.dts"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("target/linux/econet/dts/en751221_generic.dts")
          s = p.read_text()

          replacements = [
              (
                  "reg = <0x00000000 0x4000000>;",
                  "reg = <0x00000000 0x10000000>;"
              ),
              (
                  "linux,usable-memory-range = <0x00020000 0x3fe0000>;",
                  "linux,usable-memory-range = <0x00020000 0x0ffe0000>;"
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(
                      f"ERROR: expected DTS text not found: {old}"
                  )

              s = s.replace(old, new, 1)

          if "&pcie0 {" not in s:
              s += r'''

          &pcie0 {
              status = "okay";
          };

          &pcie1 {
              status = "okay";
          };
          '''

          p.write_text(s)
          PY

          sed -n '1,320p' "$DTS"

      - name: Fix EN751221 kernel config
        shell: bash
        run: |
          set -eux

          CONFIG="target/linux/econet/en751221/config-6.18"

          test -f "$CONFIG"

          if ! grep -qxF '# CONFIG_MEDIATEK_GE_SOC_PHY is not set' "$CONFIG"; then
            printf '%s\n' '# CONFIG_MEDIATEK_GE_SOC_PHY is not set' >> "$CONFIG"
          fi

          echo "EN751221 kernel PHY config:"

          grep -E \
            '^(CONFIG_PHYLIB|CONFIG_MEDIATEK_GE_PHY|CONFIG_MTK_NET_PHYLIB|CONFIG_MEDIATEK_GE_SOC_PHY|# CONFIG_MEDIATEK_GE_SOC_PHY)' \
            "$CONFIG" || true

          echo
          echo "Full target kernel config:"
          cat "$CONFIG"

      - name: Configure EN751221 FULL image
        shell: bash
        run: |
          set -eux

          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          CONFIG_PACKAGE_base-files=y
          CONFIG_PACKAGE_netifd=y

          CONFIG_PACKAGE_ethtool-full=y
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_mdio-tools=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y
          CONFIG_PACKAGE_odhcpd=y
          CONFIG_PACKAGE_odhcp6c=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7615-common=y
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-mt7615-firmware=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_hostapd-utils=y

          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_usbutils=y

          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-fs-ntfs3=y
          CONFIG_PACKAGE_kmod-fs-exfat=y

          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_PACKAGE_kmod-i2c-dev=y
          CONFIG_PACKAGE_gpiod-tools=y
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_kmod-leds-gpio=y

          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-nat=y
          CONFIG_PACKAGE_kmod-nf-nat6=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          CONFIG_PACKAGE_kmod-ipt-core=y

          CONFIG_PACKAGE_kmod-tun=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-i18n-base-vi=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y

          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-uhttpd=y
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y

          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y

          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_nlbwmon=y

          CONFIG_PACKAGE_luci-app-statistics=y
          CONFIG_PACKAGE_collectd=y

          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_adblock=y

          CONFIG_PACKAGE_luci-app-ksmbd=y
          CONFIG_PACKAGE_ksmbd-server=y

          CONFIG_PACKAGE_luci-i18n-firewall-vi=y
          CONFIG_PACKAGE_luci-i18n-package-manager-vi=y
          CONFIG_PACKAGE_luci-i18n-uhttpd-vi=y
          CONFIG_PACKAGE_luci-i18n-attendedsysupgrade-vi=y
          CONFIG_PACKAGE_luci-i18n-sqm-vi=y
          CONFIG_PACKAGE_luci-i18n-nlbwmon-vi=y
          CONFIG_PACKAGE_luci-i18n-statistics-vi=y
          CONFIG_PACKAGE_luci-i18n-adblock-vi=y
          CONFIG_PACKAGE_luci-i18n-ksmbd-vi=y

          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_uhttpd-mod-ucode=y

          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_nand-utils=y
          CONFIG_PACKAGE_ubi-utils=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_mount-utils=y

          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_zoneinfo-asia=y

          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_strace=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_iperf3=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_btop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_lsof=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_procps-ng=y
          CONFIG_PACKAGE_tree=y
          CONFIG_PACKAGE_logrotate=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_minicom=y
          CONFIG_PACKAGE_gdbserver=y
          EOF

          make defconfig

          echo
          echo "Final selected configuration:"
          grep -E '^(CONFIG_TARGET_|CONFIG_PACKAGE_)' .config | sort

      - name: Validate requested configuration
        shell: bash
        run: |
          set -eux

          REQUIRED='
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-uhttpd=y

          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_uhttpd-mod-ucode=y

          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y

          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7615-common=y
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-mt7615-firmware=y
          CONFIG_PACKAGE_wpad-mbedtls=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_hostapd-utils=y

          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y

          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-nat=y
          CONFIG_PACKAGE_kmod-nf-nat6=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          CONFIG_PACKAGE_kmod-ipt-core=y

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_usbutils=y

          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y

          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y

          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_nand-utils=y
          CONFIG_PACKAGE_ubi-utils=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_gdbserver=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_minicom=y
          CONFIG_PACKAGE_logrotate=y
          '

          FAILED=0

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            if ! grep -qxF "$line" .config; then
              echo "MISSING CONFIG: $line"
              grep -E "^#? ?${line%%=*}" .config || true
              FAILED=1
            fi
          done <<< "$REQUIRED"

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "ERROR: One or more required CONFIG options were dropped."
            exit 1
          fi

          echo
          echo "All critical configuration options survived defconfig."

      - name: Cache OpenWrt build tree
        uses: actions/cache@v4
        with:
          path: |
            build_dir
            staging_dir
          key: ${{ runner.os }}-openwrt-en751221-build-${{ env.OPENWRT_REV }}-${{ hashFiles('.config', 'target/linux/econet/**', 'target/linux/generic/**', 'package/**', 'feeds.conf.default', 'include/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-en751221-build-${{ env.OPENWRT_REV }}-
            ${{ runner.os }}-openwrt-en751221-build-

      - name: Build OpenWrt
        shell: bash
        run: |
          set -eux

          make -j2 V=s

      - name: Verify built root filesystem
        shell: bash
        run: |
          set -eux

          ROOTFS=""

          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue

            if [ -d "$candidate/etc" ] && [ -d "$candidate/www" ]; then
              ROOTFS="$candidate"
              break
            fi
          done < <(
            find build_dir staging_dir \
              -type d \
              \( -name 'root-*' -o -name 'root' \) \
              2>/dev/null \
              | sort
          )

          if [ -z "$ROOTFS" ]; then
            echo "ERROR: OpenWrt target root filesystem was not found."

            echo
            echo "Candidate root directories:"
            find build_dir staging_dir \
              -type d \
              \( -name 'root-*' -o -name 'root' \) \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "Target root filesystem:"
          echo "$ROOTFS"

          echo
          echo "Root filesystem:"
          ls -lah "$ROOTFS"

          echo
          echo "Checking LuCI runtime:"

          test -d "$ROOTFS/usr/lib/lua/luci" \
            || test -d "$ROOTFS/usr/share/ucode/luci"

          test -d "$ROOTFS/www"

          echo
          echo "Checking configuration:"

          test -e "$ROOTFS/etc/config/uhttpd"
          test -e "$ROOTFS/etc/config/firewall"

          echo
          echo "LuCI runtime files:"

          if [ -d "$ROOTFS/usr/lib/lua/luci" ]; then
            find "$ROOTFS/usr/lib/lua/luci" \
              -maxdepth 2 \
              -type f \
              | head -100
          fi

          if [ -d "$ROOTFS/usr/share/ucode/luci" ]; then
            find "$ROOTFS/usr/share/ucode/luci" \
              -maxdepth 2 \
              -type f \
              | head -100
          fi

          echo
          echo "Web files:"

          find "$ROOTFS/www" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -100

          echo
          echo "MT7615 / mt76 modules:"

          find "$ROOTFS/lib/modules" \
            -type f \
            | grep -E 'mt7615|mt76' \
            | sort || true

          echo
          echo "USB / storage modules:"

          find "$ROOTFS/lib/modules" \
            -type f \
            | grep -E 'usb|xhci|ehci|ohci|uas|scsi' \
            | sort || true

          echo
          echo "NAND / UBI tools:"

          find "$ROOTFS/usr" \
            -type f \
            | grep -E '/(nanddump|nandwrite|flash_erase|mtdinfo|ubinfo|ubiattach|ubidetach|ubiformat)$' \
            | sort || true

          echo
          echo "Root filesystem verification: OK"

      - name: Verify output
        shell: bash
        run: |
          set -eux

          OUT="bin/targets/econet/en751221"

          test -d "$OUT"

          ls -lah "$OUT"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -exec file {} \;

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            -exec sha256sum {} \; \
            | sort

      - name: Save build metadata
        shell: bash
        run: |
          set -eux

          OUT="bin/targets/econet/en751221"

          mkdir -p "$OUT/build-info"

          cp .config \
            "$OUT/build-info/config"

          cp target/linux/econet/dts/en751221_generic.dts \
            "$OUT/build-info/en751221_generic.dts"

          git rev-parse HEAD \
            > "$OUT/build-info/openwrt-revision.txt"

          date -u \
            > "$OUT/build-info/build-time-utc.txt"

          cat "$OUT/build-info/openwrt-revision.txt"
          cat "$OUT/build-info/build-time-utc.txt"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-en751221-build2-256m-full-luci
          path: bin/targets/econet/en751221/
          if-no-files-found: error
          retention-days: 7
