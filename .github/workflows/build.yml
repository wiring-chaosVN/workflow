name: Build EN751221 256M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Patch EN751221 memory
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("target/linux/econet/dts/en751221_generic.dts")
          s = p.read_text()

          s = s.replace(
              "reg = <0x00000000 0x4000000>;",
              "reg = <0x00000000 0x10000000>;"
          )

          s = s.replace(
              "linux,usable-memory-range = <0x00020000 0x3fe0000>;",
              "linux,usable-memory-range = <0x00020000 0x0ffe0000>;"
          )

          p.write_text(s)
          PY

          echo "===== PATCHED DTS ====="
          grep -nE "memory@|reg =|usable-memory" \
            target/linux/econet/dts/en751221_generic.dts

      - name: Configure target
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          EOF

          make defconfig

          echo "===== TARGET CONFIG ====="
          grep '^CONFIG_TARGET_econet' .config
          grep '^CONFIG_TARGET_ROOTFS_INITRAMFS' .config

      - name: Build
        run: |
          make -j2 V=s

      - name: List output
        run: |
          ls -lh bin/targets/econet/en751221/
          sha256sum bin/targets/econet/en751221/*

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: EN751221-256M-initramfs
          path: bin/targets/econet/en751221/*
