      - name: Save OpenWrt build tree
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            build_dir
            staging_dir
          key: ${{ env.BUILD_CACHE_KEY }}

      - name: Verify production tclinux image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Discover OpenWrt target output ==="

          test -d bin/targets

          find bin/targets \
            -type f \
            \( \
              -name '*.trx' \
              -o -name '*.bin' \
              -o -name '*.img' \
              -o -name '*.itb' \
            \) \
            -print \
            | sort

          echo
          echo "=== Locate production tclinux image ==="

          mapfile -t TCLINUX_IMAGES < <(
            find bin/targets \
              -type f \
              -name '*tclinux*.trx' \
              -print \
              | sort
          )

          if [ "${#TCLINUX_IMAGES[@]}" -eq 0 ]; then
            echo "ERROR: no *tclinux*.trx was produced."

            echo
            echo "=== bin/targets tree ==="
            find bin/targets \
              -maxdepth 8 \
              -print \
              | sort || true

            echo
            echo "=== Search build tree ==="
            find build_dir \
              -type f \
              \( \
                -name '*.trx' \
                -o -name '*tclinux*' \
              \) \
              -print \
              | sort \
              | head -n 300 || true

            exit 1
          fi

          echo "Found tclinux images:"
          printf '  %s\n' "${TCLINUX_IMAGES[@]}"

          IMG="$(
            for f in "${TCLINUX_IMAGES[@]}"; do
              stat -c '%s %n' "$f"
            done |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-
          )"

          test -n "$IMG"
          test -f "$IMG"

          SIZE="$(stat -c '%s' "$IMG")"
          LIMIT=$((0x01e00000))

          echo
          echo "Production image: $IMG"
          echo "Image size:       $SIZE bytes"
          echo "Partition limit:  $LIMIT bytes"

          test "$SIZE" -gt 0
          test "$SIZE" -le "$LIMIT"

          LEN_HEX="$(printf '%X' "$SIZE")"

          OUT="$(dirname "$IMG")"

          printf '%s\n' \
            "xmdm 80020000 $LEN_HEX" \
            "# send $(basename "$IMG") through XMODEM" \
            "flash 80000 80020000 $LEN_HEX" \
            "go" \
            > "$OUT/nand-flash.txt"

          echo
          echo "=== Validate tclinux header ==="

          python3 - "$IMG" <<'PY'
          import struct
          import sys

          img = sys.argv[1]

          with open(img, "rb") as f:
              hdr = f.read(0x100)

          if len(hdr) != 0x100:
              raise SystemExit("ERROR: tclinux header is shorter than 0x100 bytes")

          if hdr[0:4] != b"2RDH":
              raise SystemExit(
                  f"ERROR: invalid tclinux magic: {hdr[0:4]!r}"
              )

          hdrlen = struct.unpack(">I", hdr[0x04:0x08])[0]
          total_len = struct.unpack(">I", hdr[0x08:0x0c])[0]
          kernel_len = struct.unpack(">I", hdr[0x30:0x34])[0]
          rootfs_len = struct.unpack(">I", hdr[0x34:0x38])[0]
          romfile_len = struct.unpack(">I", hdr[0x38:0x3c])[0]
          loadaddr = struct.unpack(">I", hdr[0x5c:0x60])[0]

          print(f"magic       = {hdr[0:4].decode()}")
          print(f"hdrlen      = 0x{hdrlen:x}")
          print(f"total_len   = 0x{total_len:x}")
          print(f"kernel_len  = 0x{kernel_len:x}")
          print(f"rootfs_len  = 0x{rootfs_len:x}")
          print(f"romfile_len = 0x{romfile_len:x}")
          print(f"loadaddr    = 0x{loadaddr:08x}")

          if hdrlen != 0x100:
              raise SystemExit("ERROR: invalid tclinux header length")

          if kernel_len == 0:
              raise SystemExit("ERROR: kernel_len is zero")

          if rootfs_len == 0:
              raise SystemExit("ERROR: rootfs_len is zero")

          if total_len > 0x01e00000:
              raise SystemExit("ERROR: total_len exceeds tclinux partition")

          if 0x100 + kernel_len + rootfs_len > total_len:
              raise SystemExit(
                  "ERROR: kernel/rootfs lengths exceed total_len"
              )

          if loadaddr != 0x80020000:
              raise SystemExit(
                  f"ERROR: unexpected boot decompression address: 0x{loadaddr:08x}"
              )

          print("tclinux header validation: OK")
          PY


          echo
          echo "=== SHA256 ==="
          sha256sum "$IMG"

          echo
          echo "=== XMODEM / NAND commands ==="
          cat "$OUT/nand-flash.txt"

          echo
          echo "=== Verify initramfs ==="

          INITRAMFS="$(
            find bin/targets \
              -type f \
              -name 'initramfs-kernel.bin' \
              -print |
              sort |
              head -n 1
          )"

          test -n "$INITRAMFS"
          test -f "$INITRAMFS"

          echo "Initramfs: $INITRAMFS"

          echo
          echo "=== Final target output ==="
          ls -lah "$OUT"


      - name: Save build metadata
        shell: bash
        run: |
          set -eux
          OUT="bin/targets/econet/en751221"
          mkdir -p "$OUT/build-info"

          cp .config "$OUT/build-info/config"
          cp target/linux/econet/dts/en751221_generic.dts "$OUT/build-info/en751221_generic.dts"
          cp target/linux/econet/en751221/config-6.18 "$OUT/build-info/en751221-kernel-config"
          cp target/linux/econet/image/en751221.mk "$OUT/build-info/en751221-image.mk"
          cp target/linux/generic/files/drivers/mtd/mtdsplit/mtdsplit_tclinux.c "$OUT/build-info/mtdsplit_tclinux.c"

          git rev-parse HEAD > "$OUT/build-info/openwrt-revision.txt"
          printf '%s\n' "$FEEDS_REV_HASH" > "$OUT/build-info/feeds-revision-hash.txt"
          printf '%s\n' "$BUILD_CACHE_KEY" > "$OUT/build-info/build-cache-key.txt"
          date -u > "$OUT/build-info/build-time-utc.txt"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-en751221-ac1000hi-256m-full
          path: bin/targets/econet/en751221/
          if-no-files-found: error
          retention-days: 7
