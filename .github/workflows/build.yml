name: Build EN751221 256M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-distutils \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Patch EN751221 memory
        shell: bash
        run: |
          set -e

          DTS="target/linux/econet/dts/en751221_generic.dts"

          echo "=== Original DTS ==="
          sed -n '1,200p' "$DTS"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("target/linux/econet/dts/en751221_generic.dts")
          data = path.read_text()

          old_reg = "reg = <0x00000000 0x4000000>;"
          new_reg = "reg = <0x00000000 0x10000000>;"

          old_range = "linux,usable-memory-range = <0x00020000 0x3fe0000>;"
          new_range = "linux,usable-memory-range = <0x00020000 0x0ffe0000>;"

          if old_reg not in data:
              raise SystemExit("ERROR: Original RAM reg definition was not found")

          if old_range not in data:
              raise SystemExit("ERROR: Original linux,usable-memory-range definition was not found")

          data = data.replace(old_reg, new_reg, 1)
          data = data.replace(old_range, new_range, 1)

          path.write_text(data)
          PY

          echo
          echo "=== Patched DTS ==="
          grep -n -E 'reg =|linux,usable-memory-range' "$DTS"

      - name: Configure target
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          EOF

          make defconfig

          echo
          echo "=== Target configuration ==="
          grep -E '^CONFIG_TARGET_(econet|ROOTFS_INITRAMFS)' .config || true

      - name: Build
        run: |
          make -j2 V=s

      - name: List output
        run: |
          set -e

          OUT="bin/targets/econet/en751221"

          echo "=== OUTPUT DIRECTORY ==="
          ls -lah "$OUT"

          echo
          echo "=== OUTPUT FILES ==="
          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "=== SHA256 ==="
          find "$OUT" -maxdepth 1 -type f -exec sha256sum {} +

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-en751221-256m
          path: bin/targets/econet/en751221/
          if-no-files-found: error

      - name: Show build information
        if: always()
        run: |
          echo "=== Git revision ==="
          git rev-parse HEAD || true

          echo
          echo "=== Target output ==="
          ls -lah bin/targets/econet/en751221/ 2>/dev/null || true
