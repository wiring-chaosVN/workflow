name: Build EN751221 256M FULL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          fetch-depth: 1

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget

      - name: Patch EN751221 256M DTS
        shell: bash
        run: |
          set -e

          DTS="target/linux/econet/dts/en751221_generic.dts"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("target/linux/econet/dts/en751221_generic.dts")
          s = p.read_text()

          replacements = [
              (
                  "reg = <0x00000000 0x4000000>;",
                  "reg = <0x00000000 0x10000000>;"
              ),
              (
                  "linux,usable-memory-range = <0x00020000 0x3fe0000>;",
                  "linux,usable-memory-range = <0x00020000 0x0ffe0000>;"
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(
                      f"ERROR: expected DTS text not found: {old}"
                  )
              s = s.replace(old, new, 1)

          # Enable both PCIe controllers for hardware discovery.
          s += r'''

          &pcie0 {
              status = "okay";
          };

          &pcie1 {
              status = "okay";
          };
          '''

          p.write_text(s)
          PY

          echo "=== EN751221 DTS ==="
          sed -n '1,260p' "$DTS"

      - name: Configure EN751221 FULL test image
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_econet=y
          CONFIG_TARGET_econet_en751221=y
          CONFIG_TARGET_econet_en751221_DEVICE_en751221_generic=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y

          # EN751221 / NAND / PCIe
          CONFIG_SPI_AIROHA_SNFI=y
          CONFIG_MTD_NAND_MTK_BMT=y

          # MT7615 PCIe Wi-Fi
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-mt7615-firmware=y

          # USB
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_usbutils=y

          # PCI / Ethernet diagnostics
          CONFIG_PACKAGE_pciutils=y
          CONFIG_PACKAGE_ethtool=y

          # I2C / GPIO diagnostics
          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_PACKAGE_gpio-tools=y

          # Router stack
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y

          # PPPoE
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y

          # Wi-Fi userspace
          CONFIG_PACKAGE_wpad-basic-mbedtls=y

          # Debug / recovery
          CONFIG_PACKAGE_strace=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_mtd=y
          CONFIG_PACKAGE_nand-utils=y
          CONFIG_PACKAGE_ubi-utils=y
          EOF

          make defconfig

          echo
          echo "=== FINAL IMPORTANT CONFIG ==="
          grep -E \
            '^(CONFIG_TARGET_|CONFIG_SPI_AIROHA_SNFI|CONFIG_MTD_NAND_MTK_BMT|CONFIG_PACKAGE_(luci|uhttpd|firewall4|dnsmasq|ppp|kmod-mt7615|wpad|kmod-usb|pciutils|usbutils|nand-utils|ubi-utils|mtd))' \
            .config | sort

      - name: Build
        run: |
          make -j2 V=s

      - name: Verify output
        run: |
          set -e

          OUT="bin/targets/econet/en751221"

          test -d "$OUT"

          echo "=== OUTPUT DIRECTORY ==="
          ls -lah "$OUT"

          echo
          echo "=== FILE TYPES ==="
          find "$OUT" -maxdepth 1 -type f -exec file {} \;

          echo
          echo "=== SHA256 ==="
          find "$OUT" -maxdepth 1 -type f -exec sha256sum {} + | sort

          echo
          echo "=== SIZES ==="
          find "$OUT" -maxdepth 1 -type f \
            -printf '%f %s bytes\n' | sort

      - name: Upload Build #1
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-en751221-build1-256m-full
          path: bin/targets/econet/en751221/
          if-no-files-found: error

      - name: Show build information
        if: always()
        run: |
          echo "=== OpenWrt revision ==="
          git rev-parse HEAD || true

          echo
          echo "=== Target output ==="
          ls -lah bin/targets/econet/en751221/ 2>/dev/null || true
